[package]
name = "rustyssl-libssl"
description = "libssl.so.3 drop-in: exports the SSL_* symbols and forwards them into libcrypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only a static archive: `cargo xtask dist` links the shared library from it, because rustc's
# own version script for a cdylib can't be combined with OpenSSL's symbol versions.
[lib]
name = "ssl"
crate-type = ["staticlib"]

[dependencies]
libc.workspace = true
rustyssl-abi.workspace = true

[lints]
workspace = true
