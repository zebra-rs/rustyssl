[package]
name = "rustssl-libcrypto"
description = "libcrypto.so.3 drop-in: contains the whole rustssl implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only a static archive: `cargo xtask dist` links the shared library from it, because rustc's
# own version script for a cdylib can't be combined with OpenSSL's symbol versions.
[lib]
name = "crypto"
crate-type = ["staticlib"]

[dependencies]
rustssl-capi.workspace = true

[lints]
workspace = true
