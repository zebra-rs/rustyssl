[workspace]
resolver = "3"
members = ["crates/*", "libs/*", "xtask"]
# fuzz/ is its own workspace: libfuzzer-sys builds C++, which the libraries must not use.
# libs/legacy is C (the legacy provider's module, which `cargo xtask dist` links), not a crate.
exclude = ["fuzz", "libs/legacy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/zebra-rs/rustyssl"
publish = false

[workspace.dependencies]
rustyssl-abi = { path = "crates/rustyssl-abi" }
rustyssl-asn1 = { path = "crates/rustyssl-asn1" }
rustyssl-conf = { path = "crates/rustyssl-conf" }
rustyssl-crypto = { path = "crates/rustyssl-crypto" }
rustyssl-pki = { path = "crates/rustyssl-pki" }
rustyssl-tls = { path = "crates/rustyssl-tls" }
rustyssl-quic = { path = "crates/rustyssl-quic" }
rustyssl-capi = { path = "crates/rustyssl-capi" }
rustyssl-ossl = { path = "crates/rustyssl-ossl" }

# Third-party crates. Each one is recorded in docs/DEPENDENCIES.md.
libc = { version = "0.2", default-features = false }
sha2 = { version = "0.11", default-features = false }
quote = { version = "1", default-features = false }
subtle = { version = "2.6", default-features = false }
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }

# Baseline for every crate. Crate-level attributes add more: `forbid(unsafe_code)`
# outside rustyssl-capi, libs/*, and rustyssl-ossl, and `arithmetic_side_effects` in parser and protocol
# crates. Rule numbers refer to "Security rules" in README.md.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Rule 1: every unsafe operation is justified on its own.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Rule 2: no silent truncation or sign change between int, size_t, and long.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Rule 3: no panics on attacker-controlled input (tests are exempt, see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# A library must not print or exit on its host application's behalf.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
exit = "deny"

[profile.dev]
# ffi_export! catches unwinds at the C boundary, so panics must unwind.
panic = "unwind"

[profile.release]
panic = "unwind"
# Security over speed: integer overflow becomes a caught panic, not silent wrapping.
overflow-checks = true
