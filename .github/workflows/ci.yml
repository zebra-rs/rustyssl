# CI for rustyssl (docs/TEST_PLAN.md, "CI organization").
#
# Every push and pull request runs the full gate on Linux x86_64. The weekly and manual runs
# add macOS arm64 and Linux arm64, and fuzzing: those runners cost several times more Actions
# minutes on a private repository, so they don't run on every push.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install GnuPG (verifies the reference OpenSSL download) and pkg-config
        if: runner.os == 'macOS'
        run: |
          command -v gpgv || brew install gnupg
          command -v pkg-config || brew install pkgconf
      - uses: Swatinem/rust-cache@v2
      # Declared after rust-cache, so it saves target/ref before rust-cache cleans target/.
      - name: Cache the reference OpenSSL build
        uses: actions/cache@v6
        with:
          path: target/ref
          key: ref-openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('abi/openssl-*/VERSION.toml', 'xtask/src/reference.rs', 'xtask/src/vendor.rs') }}
      - name: Cache upstream OpenSSL's test programs
        uses: actions/cache@v6
        with:
          path: target/ref-suite
          key: ref-suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('abi/openssl-*/VERSION.toml', 'xtask/src/test_openssl_suite.rs', 'xtask/src/vendor.rs') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: C conformance tests (reference vs rustyssl)
        run: cargo xtask test-c
      - name: Differential tests (reference vs rustyssl)
        run: cargo xtask test-differential --random 1000
      - name: The reference's openssl tool on rustyssl
        run: cargo xtask test-apps
      - name: Upstream OpenSSL's evp_test on rustyssl
        run: cargo xtask test-openssl-suite
      - name: ABI conformance (symbols, metadata, signatures, layouts, constants, linking)
        run: cargo xtask abi-check

  # Miri interprets one thread at a time, so the tests run in parallel jobs, each one Miri
  # process over a part of them chosen by test name; together the parts cover every test
  # once. (A process per test, as nextest runs them, repeats the library's set-up in each and
  # took longer than one process over all of them.)
  miri:
    name: miri (${{ matrix.part.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: evp-sigver-ctrl
            filter: 'evp::sigver evp::ctrl'
          - name: evp-pkey
            filter: 'evp::pkey'
          - name: evp-signature-kem-pmeth
            filter: 'evp::signature evp::kem evp::pmeth'
          - name: evp-others
            filter: 'evp:: --skip evp::sigver --skip evp::ctrl --skip evp::pkey
              --skip evp::signature --skip evp::kem --skip evp::pmeth'
          - name: others
            filter: '--skip evp::'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@v2
      # The filters also pick the doctests, by their module paths.
      - run: cargo +nightly miri test -p rustyssl-capi -- ${{ matrix.part.filter }}

  codegen:
    name: generated files are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Cache bindgen
        id: bindgen
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-cli-0.73.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install --locked bindgen-cli --version 0.73.2
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask codegen
      # Also fails if an export is defined without a C conformance test that calls it.
      - run: cargo xtask coverage
      - name: Fail if the committed generated code or docs/coverage.md differs
        run: git diff --exit-code

  # The tool versions are pinned: a different cargo-vet formats supply-chain/ differently and
  # fails. cargo-vet 0.10.2 has no prebuilt release, so it's built once and cached.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Cache cargo-vet
        id: cargo-vet
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-vet
          key: cargo-vet-0.10.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-vet.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-vet --version 0.10.2
      - run: cargo deny check
      - run: cargo vet --locked

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz every target for 5 minutes
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=300
          done
