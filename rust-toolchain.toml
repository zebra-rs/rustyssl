[toolchain]
# Pinned for reproducible builds. 1.99 is the minimum: it can define C-variadic
# functions (BIO_printf, ERR_add_error_data) on stable.
channel = "1.99.0"
components = ["rustfmt", "clippy"]
# The targets rustssl-abi has bindings for; `cargo xtask codegen` checks each one.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
profile = "minimal"
