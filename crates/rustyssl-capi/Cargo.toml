[package]
name = "rustyssl-capi"
description = "The C ABI layer: every C export of libcrypto and libssl, handles, BIO, callbacks, ERR, and CRYPTO_malloc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
rustyssl-abi.workspace = true
rustyssl-asn1.workspace = true
rustyssl-conf.workspace = true
rustyssl-crypto.workspace = true
rustyssl-pki.workspace = true
rustyssl-quic.workspace = true
rustyssl-tls.workspace = true
subtle.workspace = true

[dev-dependencies]
rustyssl-quic = { workspace = true, features = ["test-provider"] }
rustyssl-tls = { workspace = true, features = ["test-provider"] }

[features]
# The Fedora profile (`cargo xtask dist --profile fedora`): Fedora's ABI extras, MD2 (`MD2_*`,
# `EVP_md2`, the legacy provider's MD2) and the SCTP datagram functions.
fedora = []

[lints]
workspace = true
