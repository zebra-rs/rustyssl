[package]
name = "rustyssl-crypto"
description = "Algorithm facade and backend traits, DRBG, BIGNUM, and the built-in provider algorithms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake2 = { version = "0.11", default-features = false }
digest = { version = "0.11", default-features = false }
keccak = { version = "0.2", default-features = false }
md-5 = { version = "0.11", default-features = false }
md4 = { version = "0.11", default-features = false }
ripemd = { version = "0.2", default-features = false }
rustyssl-abi.workspace = true
rustyssl-asn1.workspace = true
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
sm3 = { version = "0.5", default-features = false }
whirlpool = { version = "0.11", default-features = false }

[lints]
workspace = true
