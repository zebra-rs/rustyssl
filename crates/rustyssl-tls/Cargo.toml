[package]
name = "rustyssl-tls"
description = "Sans-IO TLS 1.0-1.3 and DTLS: record layer, handshake state machines, cipher-string parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustyssl-asn1.workspace = true
rustyssl-crypto.workspace = true
rustyssl-abi.workspace = true
rustyssl-pki.workspace = true
subtle.workspace = true
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[features]
# The crate's own test provider (crypto through rustyssl-crypto directly, with deterministic
# randomness) for the fuzz targets. Never enabled by anything that ships.
test-provider = []

[lints]
workspace = true
