# `cargo deny check`: the supply-chain gate from README.md security rule 8. Every dependency
# is also recorded in docs/DEPENDENCIES.md and audited with `cargo vet` (supply-chain/).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses compatible with Apache-2.0 only. Unicode-3.0 covers unicode-ident's
# data tables; BSD-3-Clause covers subtle.
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path; they are never published.
allow-wildcard-paths = true

[bans.build]
# Build scripts are where C sneaks in (`cc`, `*-sys`). These only probe the compiler and set
# cfgs; anything new must be reviewed and added here.
allow-build-scripts = [
    # Sets `getrandom_msan` when built with MemorySanitizer; nothing else.
    # Sets cfgs for the limb width (from the target's pointer width), the backend (SIMD on
    # x86_64, serial elsewhere), and the nightly channel (through rustc_version); nothing else.
    { crate = "curve25519-dalek" },
    { crate = "getrandom" },
    { crate = "libc" },
    { crate = "proc-macro2" },
    { crate = "quote" },
]
executables = "deny"
interpreted = "deny"
script-extensions = ["sh", "bash", "py", "pl", "rb", "ps1", "bat", "cmd"]

# The crate's own test script, which builds never run.
[[bans.build.bypass]]
crate = "curve25519-dalek"
allow-globs = ["tests/build_tests.sh"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
