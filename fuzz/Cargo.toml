# Fuzz targets (TEST_PLAN.md, layer L9), run with `cargo +nightly fuzz run <target>`.
#
# This is its own workspace on purpose: libfuzzer-sys compiles libFuzzer (C++), and nothing
# that ships in libcrypto or libssl may depend on C code (README.md, security rule 8).

[package]
name = "rustyssl-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libc = "0.2"
rustyssl-abi = { path = "../crates/rustyssl-abi" }
rustyssl-asn1 = { path = "../crates/rustyssl-asn1" }
rustyssl-capi = { path = "../crates/rustyssl-capi" }
rustyssl-crypto = { path = "../crates/rustyssl-crypto" }

[workspace]

[[bin]]
name = "buf_mem"
path = "fuzz_targets/buf_mem.rs"
test = false
doc = false
bench = false

