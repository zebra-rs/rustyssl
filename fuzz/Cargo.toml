# Fuzz targets (TEST_PLAN.md, layer L9), run with `cargo +nightly fuzz run <target>`.
#
# This is its own workspace on purpose: libfuzzer-sys compiles libFuzzer (C++), and nothing
# that ships in libcrypto or libssl may depend on C code (AGENTS.md, security rule 8).

[package]
name = "rustyssl-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustyssl-abi = { path = "../crates/rustyssl-abi" }
rustyssl-capi = { path = "../crates/rustyssl-capi" }

[workspace]

[[bin]]
name = "buf_mem"
path = "fuzz_targets/buf_mem.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stack"
path = "fuzz_targets/stack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lhash"
path = "fuzz_targets/lhash.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hex"
path = "fuzz_targets/hex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bio_mem"
path = "fuzz_targets/bio_mem.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bio_printf"
path = "fuzz_targets/bio_printf.rs"
test = false
doc = false
bench = false
